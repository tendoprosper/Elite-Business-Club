    @keyframes dashed-explode {
      from, 25% { transform: scale(0); }
      to { stroke-width: 0; transform: scale(2); }
    }
    @keyframes dashed-rotate-ccw {
      from, 25% { transform: rotate(0); visibility: visible; }
      to { transform: rotate(-22.5deg); visibility: hidden; }
    }
    @keyframes dot-scale {
      from, 25% { transform: scale(1); }
      to { transform: scale(0); }
    }
    @keyframes ring-rotate-cw {
      from, 25% { transform: scale(0) rotate(0); }
      to { transform: scale(1) rotate(22.5deg); }
    }
    @keyframes ring-rotate-ccw {
      from, 25% { transform: scale(0) rotate(0); }
      to { transform: scale(1) rotate(-22.5deg); }
    }
