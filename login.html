<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Club Member Dashboard</title>
<style>
:root{
  --bg-dark:#0b3d91;
  --bg-light:#f5f5f5;
  --text-dark:#fff;
  --text-light:#000;
  --card-dark:rgba(0,0,0,0.75);
  --card-light:rgba(255,255,255,0.95);
  --highlight:#f7b733;
}
body{font-family:Arial,sans-serif;margin:0;padding:0;background:var(--bg-dark);color:var(--text-dark);transition:0.3s;}
body.light{background:var(--bg-light);color:var(--text-light);}
.container{background:var(--card-dark);padding:20px;border-radius:12px;width:95%;max-width:800px;margin:20px auto;transition:0.3s;}
body.light .container{background:var(--card-light);}
input,button{width:100%;padding:10px;margin:5px 0;border:none;border-radius:6px;box-sizing:border-box;}
button{background:var(--highlight);color:black;font-weight:bold;cursor:pointer;transition:0.3s;}
button:hover{background:#ffcc00;}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px;}
th,td{border:1px solid #fff;padding:8px;text-align:center;}
body.light th,body.light td{border:1px solid #000;}
.msg{margin-top:10px;color:#ffcc00;}
.announcement, .debt{background:rgba(255,255,255,0.1);padding:10px;margin:10px 0;border-radius:8px;}
body.light .announcement,body.light .debt{background:rgba(0,0,0,0.05);}
</style>
</head>
<body class="dark">

<div class="container" id="loginSection">
  <h2>Member Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p class="msg" id="loginMsg"></p>
</div>

<div class="container" id="dashboard" style="display:none;">
  <button onclick="toggleTheme()">Toggle Dark/Light Theme</button>
  <h2>Welcome, <span id="userEmail"></span></h2>

  <h3>Your Savings</h3>
  <table>
    <thead><tr><th>Date</th><th>Amount</th></tr></thead>
    <tbody id="savingsTable"></tbody>
    <tfoot><tr><th>Total Savings</th><th id="totalSavings">0</th></tr></tfoot>
  </table>

  <h3>Cash Balance</h3>
  <p id="balance">0</p>

  <h3>Announcements</h3>
  <div id="announcementsList"></div>

  <h3>Debt Notifications</h3>
  <div id="debtList"></div>

  <button onclick="logout()">Logout</button>
</div>

<script>
// --- Theme ---
window.toggleTheme=()=>{document.body.classList.toggle("dark");document.body.classList.toggle("light");};

// --- LocalStorage Data ---
let members = JSON.parse(localStorage.getItem("members")) || [];
let savings = JSON.parse(localStorage.getItem("savings")) || [];
let outflows = JSON.parse(localStorage.getItem("outflows")) || [];
let announcements = JSON.parse(localStorage.getItem("announcements")) || [];
let debts = JSON.parse(localStorage.getItem("debts")) || [];

let currentMember = null;

// --- DOM ---
const loginSection = document.getElementById("loginSection");
const dashboard = document.getElementById("dashboard");
const loginBtn = document.getElementById("loginBtn");
const loginMsg = document.getElementById("loginMsg");
const userEmailSpan = document.getElementById("userEmail");
const savingsTable = document.getElementById("savingsTable");
const totalSavingsEl = document.getElementById("totalSavings");
const balanceEl = document.getElementById("balance");
const announcementsList = document.getElementById("announcementsList");
const debtList = document.getElementById("debtList");

// --- Login ---
loginBtn.addEventListener("click",()=>{
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const member = members.find(m=>m.email===email && m.password===password);
  if(!member){loginMsg.innerText="❌ Invalid email or password"; return;}
  currentMember = member;
  loginSection.style.display="none";
  dashboard.style.display="block";
  userEmailSpan.innerText = currentMember.email;
  loadMemberData();
});

// --- Logout ---
function logout(){
  currentMember = null;
  dashboard.style.display="none";
  loginSection.style.display="block";
  savingsTable.innerHTML="";
  totalSavingsEl.innerText="0";
  balanceEl.innerText="0";
  announcementsList.innerHTML="";
  debtList.innerHTML="";
  document.getElementById("email").value="";
  document.getElementById("password").value="";
}

// --- Load Member Data ---
function loadMemberData(){
  if(!currentMember) return;

  // Savings
  savingsTable.innerHTML=""; let total=0;
  savings.forEach(s=>{
    const memberIndex = s.memberIndex;
    if(members[memberIndex] && members[memberIndex].email===currentMember.email){
      savingsTable.innerHTML += `<tr><td>${s.date}</td><td>${parseFloat(s.amount)}</td></tr>`;
      total += parseFloat(s.amount);
    }
  });
  totalSavingsEl.innerText = total.toFixed(2);

  // Cash balance after outflows
  let totalOutflow=0;
  outflows.forEach(o=>totalOutflow += parseFloat(o.amount));
  balanceEl.innerText = (total - totalOutflow).toFixed(2);

  // Announcements
  announcementsList.innerHTML="";
  announcements.forEach(a=>{
    announcementsList.innerHTML += `<div class="announcement">${a.date}: ${a.text}</div>`;
  });

  // Debt Notifications
  debtList.innerHTML="";
  debts.forEach(d=>{
    const memberIndex = members.indexOf(currentMember);
    if(d.toAll || (d.recipients && d.recipients.includes(memberIndex))){
      debtList.innerHTML += `<div class="debt">💳 Amount: ${d.amount}<br>📝 Reason: ${d.reason}<br>📅 Date: ${d.date}</div>`;
    }
  });
}
</script>
</body>
</html>
